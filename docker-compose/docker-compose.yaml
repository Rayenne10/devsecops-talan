services:
  jenkins:
    build:
      context: ..
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - jenkins_data:/var/jenkins_home
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/login']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
  prometheus:
    image: prom/prometheus:v3.7.1
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ../monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
volumes:
  jenkins_data:
  es_data:
  grafana_data:
