# Deliberately unsafe test fixture. Never reconcile this through Flux.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsafe-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: unsafe-demo}
  template:
    metadata:
      labels: {app: unsafe-demo}
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          securityContext:
            privileged: true
            runAsUser: 0
