apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-secure
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.4 # Image récente et versionnée
        ports:
        - containerPort: 80
        resources: # Limites de ressources définies (pour kube-score)
          limits:
            cpu: "450m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        securityContext: # Contexte de sécurité strict (pour kube-linter)
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
            - ALL
        livenessProbe: # Sonde de vie (pour kube-score)
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe: # Sonde de disponibilité (pour kube-score)
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
